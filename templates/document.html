{% extends "base.html" %}{% block title %}{{ doc.title }} — LycéeConnect{% endblock %}
{% block content %}<p><a href="{{ url_for('documents') }}">← Mes documents</a></p>
<article class="card document">
<div class="docmeta">Référence {{ doc.ref }} · {{ doc.category }}</div>
<h1>{{ doc.title }}</h1>
<p><b>Propriétaire :</b> {{ doc.owner }}</p><hr>
<pre>{{ body }}</pre>
<hr>
<p class="permalink">Lien permanent :
  <a href="{{ url_for('document') }}?ref={{ doc.ref }}">{{ doc.ref }}</a>
</p>
</article>{% endblock %}
